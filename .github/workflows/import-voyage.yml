name: Import Wikivoyage descriptions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shodi-voyage
  cancel-in-progress: false
jobs:
  extract:
    if: github.ref == 'refs/heads/android-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Protect the reviewed release snapshot
        run: |
          if test -f docs/release-catalog-blobs.txt; then
            echo 'Release catalog is frozen. Use a separately reviewed snapshot update.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download licensed Wikimedia data dump
        run: |
          set -eu
          python -m pip install mwparserfromhell==0.7.2 duckdb==1.5.4
          python -m py_compile scripts/import-voyage-places.py
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 180 -o dump.bz2 https://dumps.wikimedia.org/ruwikivoyage/latest/ruwikivoyage-latest-pages-articles.xml.bz2
          curl --fail --location --retry 2 --max-time 60 -o checksums https://dumps.wikimedia.org/ruwikivoyage/latest/ruwikivoyage-latest-sha1sums.txt
          python - <<'PY'
          import pathlib,re
          rows=[]
          for line in pathlib.Path("checksums").read_text().splitlines():
              m=re.fullmatch(r"([0-9a-fA-F]{40})\s+\*?(?:\./)?ruwikivoyage-(?:latest|\d{8})-pages-articles\.xml\.bz2\s*",line)
              if m: rows.append(m.group(1).lower())
          if len(set(rows))!=1: raise SystemExit("Missing or ambiguous full-dump checksum")
          pathlib.Path("dump.sha1").write_text(rows[0]+"  dump.bz2\n")
          PY
          sha1sum --check dump.sha1
          curl --fail --location --retry 2 --max-time 30 -A 'SHODI/2.0 (https://github.com/epbloger/shodi)' 'https://ru.wikivoyage.org/w/api.php?action=query&meta=siteinfo&siprop=rightsinfo&format=json' -o rights.json
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          u=urlparse(json.load(open("rights.json"))["query"]["rightsinfo"]["url"])
          assert u.hostname=="creativecommons.org" and u.path.startswith("/licenses/by-sa/4.0"), "Unrecognized source license"
          PY
      - name: Match and validate exact catalog records
        run: |
          python scripts/import-voyage-places.py "$RUNNER_TEMP/dump.bz2" --output public/data/voyage-places.js
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-voyage
          path: public/data/voyage-places.js
          if-no-files-found: error
          retention-days: 7
  integrate:
    concurrency:
      group: shodi-catalog-integrate-android-v2
      cancel-in-progress: false
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      revision: ${{ steps.integrate.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-v2
          fetch-depth: 0
      - name: Protect the reviewed release snapshot
        run: |
          if test -f docs/release-catalog-blobs.txt; then
            echo 'Release catalog is frozen. Use a separately reviewed snapshot update.'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: shodi-voyage
          path: import-snapshot
      - name: Validate JSON manifest before integrating
        id: integrate
        run: |
          git diff --quiet "$GITHUB_SHA" HEAD -- public/data/current-places.js public/data/voyage-places.js public/voyage-places.js scripts/import-voyage-places.py
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFile,writeFile} from "node:fs/promises";
          import {currentPlaces} from "./public/data/current-places.js";
          import {validateVoyage} from "./public/voyage-places.js";
          const raw=await readFile("import-snapshot/voyage-places.js","utf8");
          const m=/^\/\/[^\n]*\nexport const voyagePlaces = (\{[\s\S]*\});\n?$/.exec(raw);
          assert.ok(m);
          const data=JSON.parse(m[1]),rows=new Map(Object.values(currentPlaces).flat().map(([id,name,kind,,lat,lon])=>[id,{id,name,kind,lat,lon}]));
          assert.ok(Object.keys(data).length);
          for(const [id,row] of Object.entries(data))assert.ok(rows.has(id)&&validateVoyage(row,rows.get(id)));
          await writeFile("public/data/voyage-places.js",raw);
          await writeFile("docs/voyage-coverage.json",JSON.stringify({catalogPlaces:rows.size,descriptions:Object.keys(data).length,imageReferences:Object.values(data).filter(r=>r.image).length,license:"CC BY-SA 4.0"},null,2)+"\n");
          JS
          npm ci --ignore-scripts
          npm test
          npm run build
          git add public/data/voyage-places.js docs/voyage-coverage.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(catalog): integrate licensed geographically matched Wikivoyage descriptions"
            for attempt in 1 2 3; do
              if git push origin HEAD:android-v2; then break; fi
              git fetch origin android-v2
              git rebase origin/android-v2
              npm test
              npm run build
              test "$attempt" != 3
            done
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-apk:
    needs: integrate
    uses: ./.github/workflows/android.yml
    with:
      checkout_ref: ${{ needs.integrate.outputs.revision }}
    permissions:
      contents: read
      actions: read
