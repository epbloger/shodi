name: Enrich place descriptions
on:
  push:
    branches: [android-v2]
    paths: ['scripts/enrich-descriptions.mjs', 'scripts/import-place-photos.mjs', 'scripts/photo-import-policy.mjs', 'scripts/catalog-match-helpers.mjs', 'public/data/osm-photo-links.js', '.github/workflows/enrich-descriptions.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shodi-descriptions
  cancel-in-progress: false
jobs:
  enrich:
    if: github.ref == 'refs/heads/android-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reuse completed import if catalog and importer did not change
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "reused=false" >> "$GITHUB_OUTPUT"
          prior="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/enrich-descriptions.yml/runs?branch=android-v2&status=success&per_page=1" --jq '.workflow_runs[0] | [.id,.head_sha] | @tsv' || true)"
          if [ -z "$prior" ]; then exit 0; fi
          read -r id sha <<< "$prior"
          if ! git diff --quiet "$sha" HEAD -- public/data/current-places.js public/data/place-descriptions.js scripts/enrich-descriptions.mjs scripts/catalog-match-helpers.mjs public/data/osm-photo-links.js; then exit 0; fi
          dir="$RUNNER_TEMP/previous-descriptions"
          if gh run download "$id" -n shodi-description-import -D "$dir" && test -s "$dir/docs/description-coverage.json" && test -s "$dir/public/data/imported-descriptions.js"; then
            if ! node -e 'const r=require(process.argv[1]);process.exit(r.failedLabels===0&&r.unqueriedLabels===0&&r.linkedErrors===0?0:1)' "$dir/docs/description-coverage.json"; then exit 0; fi
            cp "$dir/docs/description-coverage.json" docs/
            cp "$dir/public/data/imported-descriptions.js" public/data/
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Match catalog to Wikidata
        if: steps.reuse.outputs.reused != 'true'
        run: node scripts/enrich-descriptions.mjs
      - name: Recover previously downloaded verified photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # This successful import job was blocked only by concurrent OSM integration.
          # Recover only photos, not its potentially stale description rows.
          git diff --quiet 9c678307d06247b837de0e3ade01d724b63e8ec0 HEAD -- public/data/current-places.js public/photos.js public/commons-thumbnail.js scripts/photo-import-policy.mjs scripts/import-place-photos.mjs || exit 0
          dir="$RUNNER_TEMP/recovered-photos"
          if ! gh run download 45479557404 -n shodi-description-import -D "$dir"; then exit 0; fi
          RECOVERY_DIR="$dir" node --input-type=module <<'JS'
          import {readFile,writeFile} from "node:fs/promises";
          import {validatePhoto} from "./public/photos.js";
          import {PHOTO_LIMIT,PHOTO_BYTES_LIMIT,photoBytes} from "./scripts/photo-import-policy.mjs";
          import {placePhotos} from "./public/data/place-photos.js";
          const raw=await readFile(process.env.RECOVERY_DIR+"/public/data/place-photos.js","utf8");
          const m=/^\/\/[^\n]*\nexport const placePhotos = (\{[\s\S]*\});\n?$/.exec(raw);
          if(!m)throw Error("Invalid recovered photo manifest");
          const recovered=JSON.parse(m[1]);
          const report=JSON.parse(await readFile(process.env.RECOVERY_DIR+"/docs/photo-coverage.json","utf8"));
          const entries=Object.entries(recovered);
          if(entries.length!==444||report.photos!==entries.length||entries.some(([id,p])=>!/^Q[1-9]\d*$/.test(id)||!validatePhoto(p)||!photoBytes(p))||entries.reduce((n,[,p])=>n+photoBytes(p),0)!==report.bytes)throw Error("Recovered artifact failed validation");
          const merged={...recovered,...placePhotos};
          const all=Object.entries(merged);
          if(all.length>PHOTO_LIMIT||all.some(([id,p])=>!/^Q[1-9]\d*$/.test(id)||!validatePhoto(p)||!photoBytes(p))||all.reduce((n,[,p])=>n+photoBytes(p),0)>PHOTO_BYTES_LIMIT)throw Error("Recovered photo budget exceeded");
          await writeFile("public/data/place-photos.js","// Licensed Wikimedia Commons thumbnails.\nexport const placePhotos = "+JSON.stringify(merged)+";\n");
          console.log("Recovered and preserved verified photo records:",all.length);
          JS
      - name: Import licensed thumbnails
        run: node scripts/import-place-photos.mjs
      - run: npm ci --ignore-scripts && npm test && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shodi-description-import
          path: |
            public/data/imported-descriptions.js
            docs/description-coverage.json
            public/data/place-photos.js
            docs/photo-coverage.json
          if-no-files-found: error
          retention-days: 7
  integrate:
    needs: enrich
    if: github.ref == 'refs/heads/android-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: android-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: shodi-description-import
          path: import-snapshot
      - name: Validate and integrate only catalog data
        id: commit
        run: |
          git diff --quiet "$GITHUB_SHA" HEAD -- public/data/current-places.js public/data/place-descriptions.js public/data/imported-descriptions.js public/data/place-photos.js public/photos.js public/commons-thumbnail.js scripts/enrich-descriptions.mjs scripts/import-place-photos.mjs scripts/photo-import-policy.mjs scripts/catalog-match-helpers.mjs public/data/osm-photo-links.js
          node --input-type=module <<'JS'
          import {readFile,writeFile} from "node:fs/promises";
          import {validatePhoto} from "./public/photos.js";
          import {PHOTO_LIMIT,PHOTO_BYTES_LIMIT,photoBytes} from "./scripts/photo-import-policy.mjs";
          const raw=await readFile("import-snapshot/public/data/imported-descriptions.js","utf8");
          const m=/^\/\/[^\n]*\nexport const importedDescriptions = (\[[\s\S]*\]);\n?$/.exec(raw);
          if(!m)throw Error("Generated data is not a plain JSON array");
          const rows=JSON.parse(m[1]);
          for(const row of rows){
            if(!Array.isArray(row)||row.length!==5||typeof row[0]!=="string"||!Number.isFinite(row[1])||Math.abs(row[1])>90||!Number.isFinite(row[2])||Math.abs(row[2])>180||typeof row[3]!=="string"||row[3].length>360||!/^Q[1-9]\d*$/.test(row[4]))throw Error("Malformed imported row");
          }
          const report=JSON.parse(await readFile("import-snapshot/docs/description-coverage.json","utf8"));
          if(!Number.isInteger(report.queriedLabels)||report.queriedLabels<=0||report.importedRecords!==rows.length||report.coveredPlaces>report.catalogPlaces)throw Error("Incomplete or inconsistent description import");
          await writeFile("public/data/imported-descriptions.js","// Generated from Wikidata CC0; matched by label and coordinates.\nexport const importedDescriptions = "+JSON.stringify(rows)+";\n");
          await writeFile("docs/description-coverage.json",JSON.stringify(report,null,2)+"\n");
          const photoRaw=await readFile("import-snapshot/public/data/place-photos.js","utf8");
          const photoMatch=/^\/\/[^\n]*\nexport const placePhotos = (\{[\s\S]*\});\n?$/.exec(photoRaw);
          if(!photoMatch)throw Error("Invalid photo manifest");
          const photos=JSON.parse(photoMatch[1]);
          const entries=Object.entries(photos);
          const photoReport=JSON.parse(await readFile("import-snapshot/docs/photo-coverage.json","utf8"));
          const actualBytes=entries.reduce((sum,[,p])=>sum+photoBytes(p),0);
          if(entries.length===0||entries.length>PHOTO_LIMIT||entries.some(([id,p])=>!/^Q[1-9]\d*$/.test(id)||!validatePhoto(p)||!photoBytes(p))||photoReport.photos!==entries.length||!Number.isInteger(photoReport.coveredPlaces)||photoReport.coveredPlaces<=0||photoReport.coveredPlaces>photoReport.catalogPlaces||photoReport.bytes!==actualBytes||actualBytes>PHOTO_BYTES_LIMIT)throw Error("Invalid photo data");
          const oldPhotos=(await import("./public/data/place-photos.js")).placePhotos;
          const previousCovered=Object.keys(oldPhotos).filter(id=>validatePhoto(oldPhotos[id])&&photoBytes(oldPhotos[id]));
          if(previousCovered.some(id=>!Object.hasOwn(photos,id)))throw Error("Photo import would discard a previously verified photo; review before replacing");
          await writeFile("public/data/place-photos.js","// Licensed Wikimedia Commons thumbnails.\nexport const placePhotos = "+JSON.stringify(photos)+";\n");
          await writeFile("docs/photo-coverage.json",JSON.stringify(photoReport,null,2)+"\n");
          JS
          npm ci --ignore-scripts
          npm test
          npm run build
          git add public/data/imported-descriptions.js docs/description-coverage.json public/data/place-photos.js docs/photo-coverage.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(catalog): integrate verified Wikidata descriptions and coverage"
            git push origin HEAD:android-v2
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-apk:
    needs: integrate
    uses: ./.github/workflows/android.yml
    with:
      checkout_ref: ${{ needs.integrate.outputs.revision }}
    permissions:
      contents: read
      actions: read
