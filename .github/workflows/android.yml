name: Android APK
on:
  push:
    branches: [android-v2, main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      production:
        description: 'Build signed RuStore APK (protected environment, main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore catalog brand links
        id: brand-links-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/place-brands.js
            docs/brand-coverage.json
          key: shodi-brand-links-v1-${{ hashFiles('public/data/current-places.js', 'docs/current-catalog.json', 'scripts/import-brand-links.py') }}
      - name: Reuse previously verified exact-snapshot brand links
        id: seed-brand-links
        if: steps.brand-links-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          echo "reused=false" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD:public/data/current-places.js)" = b772116cc742991504bf97d467023ef788d44844 || exit 0
          test "$(git rev-parse HEAD:docs/current-catalog.json)" = 017cc3d800a81a8aa6f1cb9f00ede6978f4003e6 || exit 0
          test "$(git rev-parse HEAD:scripts/import-brand-links.py)" = a2ab089d82acd5b09d7ca4270cdf8b3afeedd883 || exit 0
          seed="$(mktemp -d)"
          trap 'rm -rf "$seed"' EXIT
          if ! gh run download 45455551160 --repo epbloger/shodi --name shodi-brand-coverage --dir "$seed"; then
            echo "Previous artifact unavailable; use normal import."
            exit 0
          fi
          if ! (cd "$seed" && printf '%s\n' 'cab6592c08804cc3f02228a809d70e3b4ce385b0ba6d15f7e8c38b4fdfa6f8c1  public/data/place-brands.js' 'a148dbe7a7835258957942a7916f72d1684834b1b611596196ddf92d633fde5a  docs/brand-coverage.json' | sha256sum --check --strict); then
            echo "Artifact checksum mismatch; use normal import."
            exit 0
          fi
          cp "$seed/public/data/place-brands.js" public/data/place-brands.js
          cp "$seed/docs/brand-coverage.json" docs/brand-coverage.json
          echo "reused=true" >> "$GITHUB_OUTPUT"
      - name: Import all brand links from the exact catalog snapshot
        if: steps.brand-links-cache.outputs.cache-hit != 'true' && steps.seed-brand-links.outputs.reused != 'true'
        run: |
          pip install duckdb==1.5.4
          python scripts/import-brand-links.py
      - name: Validate brand links before reuse
        run: node scripts/validate-brand-data.mjs --links
      - name: Save catalog brand links
        if: steps.brand-links-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/place-brands.js
            docs/brand-coverage.json
          key: ${{ steps.brand-links-cache.outputs.cache-primary-key }}
      - name: Restore precise place taxonomy
        id: taxonomy-cache
        uses: actions/cache/restore@v4
        with:
          path: public/data/place-taxonomy.js
          key: shodi-taxonomy-v1-${{ hashFiles('public/data/current-places.js', 'docs/current-catalog.json', 'scripts/import-place-taxonomy.py', 'scripts/import-brand-links.py') }}
      - name: Import precise taxonomy from the exact Overture snapshot
        if: steps.taxonomy-cache.outputs.cache-hit != 'true'
        run: |
          pip install duckdb==1.5.4
          python scripts/import-place-taxonomy.py
      - name: Validate precise place taxonomy
        run: node scripts/validate-place-taxonomy.mjs
      - name: Save precise place taxonomy
        if: steps.taxonomy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/data/place-taxonomy.js
          key: ${{ steps.taxonomy-cache.outputs.cache-primary-key }}
      - name: Restore previously verified logos
        id: logo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/brand-logos.js
            docs/brand-logo-coverage.json
          key: shodi-brand-logos-v2-${{ hashFiles('public/data/current-places.js', 'public/data/place-brands.js', 'public/brands.js', 'public/photos.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shodi-brand-logos-v2-${{ hashFiles('public/data/current-places.js', 'public/data/place-brands.js', 'public/brands.js', 'public/photos.js') }}-
      - name: Verify and bundle licensed brand logo thumbnails
        run: |
          node --check scripts/import-brand-logos.mjs
          node scripts/import-brand-logos.mjs
          node scripts/validate-brand-data.mjs --logos
      - name: Save verified logo progress before compilation
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/brand-logos.js
            docs/brand-logo-coverage.json
          key: ${{ steps.logo-cache.outputs.cache-primary-key }}
      - name: Restore Wikipedia descriptions
        id: wiki-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/wiki-summaries.js
            docs/wiki-summary-coverage.json
          key: shodi-wiki-v1-${{ hashFiles('public/data/current-places.js', 'public/data/place-brands.js', 'scripts/import-wiki-summaries.mjs', 'public/wiki-summary.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shodi-wiki-v1-${{ hashFiles('public/data/current-places.js', 'public/data/place-brands.js', 'scripts/import-wiki-summaries.mjs', 'public/wiki-summary.js') }}-
      - name: Import licensed Wikipedia descriptions
        run: node scripts/import-wiki-summaries.mjs
      - name: Save Wikipedia progress
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/wiki-summaries.js
            docs/wiki-summary-coverage.json
          key: ${{ steps.wiki-cache.outputs.cache-primary-key }}
      - name: Measure actual offline catalog quality
        run: node scripts/catalog-quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shodi-brand-coverage
          path: |
            public/data/place-brands.js
            docs/brand-coverage.json
            public/data/brand-logos.js
            docs/brand-logo-coverage.json
            docs/catalog-quality.json
            public/data/place-taxonomy.js
            public/data/wiki-summaries.js
            docs/wiki-summary-coverage.json
          if-no-files-found: error
          retention-days: 7
      - run: npm ci --ignore-scripts && npm test && npm run build
      - name: Browser regression tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/build-site.mjs
          node scripts/smoke.mjs
          node scripts/mobile-smoke.mjs
          node scripts/online-photo-smoke.mjs
          node scripts/online-photo-smoke.mjs --karta
          node scripts/brand-logo-smoke.mjs
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - run: gradle -p android :app:assembleDebug :app:lintDebug --no-daemon
      - name: Android dependency inventory
        run: |
          gradle -p android :app:dependencies --configuration debugRuntimeClasspath --no-daemon > android-dependencies.txt
          gradle -p android :app:exportRuntimeDependencies --no-daemon
          node scripts/audit-android.mjs
      - name: Verify test APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          for doc in index about privacy terms consent licenses; do unzip -l "$apk" | grep "assets/$doc.html"; done
          unzip -p "$apk" assets/index.html | cmp - dist/shodi.html
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='ru.moorkis.shodi.debug'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > android-permissions.txt
          if grep -E 'ACCESS_(FINE|COARSE)_LOCATION|com.google.android.gms.permission.AD_ID|READ_CONTACTS|READ_PHONE_STATE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|RECORD_AUDIO|android.permission.CAMERA|QUERY_ALL_PACKAGES' android-permissions.txt; then
            echo "Unexpected sensitive permission"; exit 1
          fi
          python - <<'PY'
          import pathlib,re
          configs=list(pathlib.Path("android/app/build/generated").rglob("BuildConfig.java"))
          assert configs, "Missing generated BuildConfig"
          for p in configs:
              assert not re.search(r"R-M-\d+-\d+",p.read_text()), "Production ad ID in test app configuration"
          PY
          if git grep -IlE 'R-M-[0-9]+-[0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- public android ':!android/.gitignore'; then
            echo "Potential production ID or key in source"; exit 1
          fi
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|key)$'; then
            echo "Potential checked-in key file"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shodi-android-security-report
          path: |
            android-dependencies.txt
            android-runtime-dependencies.json
            android-osv-report.json
            android-permissions.txt
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  photo-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/probe-photo-coverage.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-live-photo-source-report
          path: photo-source-probe.json
          if-no-files-found: error
          retention-days: 7
  emulator:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: shodi-android-test
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096 -cores 4
          script: python scripts/android-device-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shodi-emulator-report
          path: |
            android-consent.png
            android-about.png
            android-offline.png
            android-failure.png
            android-launcher-anr.png
            android-failure.xml
            android-failure-log.txt
          retention-days: 7
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    needs: [test, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Restore the verified brand assets from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: shodi-brand-coverage
          path: .
      - name: Validate the same catalog data used by the tested APK
        run: |
          node scripts/validate-brand-data.mjs --logos
          node scripts/validate-place-taxonomy.mjs
      - run: npm ci --ignore-scripts && npm test && npm run build
      - name: Assemble signed production APK
        env:
          KEYSTORE_B64: ${{ secrets.SHODI_KEYSTORE_B64 }}
          SHODI_STORE_PASSWORD: ${{ secrets.SHODI_STORE_PASSWORD }}
          SHODI_KEY_ALIAS: ${{ secrets.SHODI_KEY_ALIAS }}
          SHODI_KEY_PASSWORD: ${{ secrets.SHODI_KEY_PASSWORD }}
          SHODI_LEGAL_APPROVED: ${{ vars.SHODI_LEGAL_APPROVED }}
          SHODI_BANNER_ID: ${{ secrets.SHODI_BANNER_ID }}
          SHODI_INTERSTITIAL_ID: ${{ secrets.SHODI_INTERSTITIAL_ID }}
          SHODI_NATIVE_ID: ${{ secrets.SHODI_NATIVE_ID }}
        shell: bash
        run: |
          set -eu
          umask 077
          export SHODI_KEYSTORE="$RUNNER_TEMP/shodi-signing.jks"
          trap 'rm -f "$SHODI_KEYSTORE"' EXIT
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SHODI_KEYSTORE"
          unset KEYSTORE_B64
          gradle -p android :app:assembleRelease :app:lintRelease -PproductionAds=true --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='ru.moorkis.shodi'"
          unzip -p "$apk" assets/index.html | cmp - dist/shodi.html
          mkdir -p android-release-output
          cp "$apk" android-release-output/shodi-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-rustore-apk
          path: android-release-output/shodi-2.0.0.apk
          if-no-files-found: error
          retention-days: 3
