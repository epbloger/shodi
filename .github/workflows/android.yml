name: Android APK
on:
  push:
    branches: [android-v2, main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'scripts/build.mjs'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Build signed RuStore APK (protected environment, main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci --ignore-scripts && npm test && npm run build
      - run: gradle -p android :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify test APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -l "$apk" | grep 'assets/index.html'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='ru.moorkis.shodi.debug'"
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci --ignore-scripts && npm test && npm run build
      - name: Assemble signed production APK
        env:
          KEYSTORE_B64: ${{ secrets.SHODI_KEYSTORE_B64 }}
          SHODI_STORE_PASSWORD: ${{ secrets.SHODI_STORE_PASSWORD }}
          SHODI_KEY_ALIAS: ${{ secrets.SHODI_KEY_ALIAS }}
          SHODI_KEY_PASSWORD: ${{ secrets.SHODI_KEY_PASSWORD }}
          SHODI_BANNER_ID: ${{ secrets.SHODI_BANNER_ID }}
          SHODI_INTERSTITIAL_ID: ${{ secrets.SHODI_INTERSTITIAL_ID }}
          SHODI_NATIVE_ID: ${{ secrets.SHODI_NATIVE_ID }}
        shell: bash
        run: |
          set -eu
          umask 077
          export SHODI_KEYSTORE="$RUNNER_TEMP/shodi-signing.jks"
          trap 'rm -f "$SHODI_KEYSTORE"' EXIT
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SHODI_KEYSTORE"
          unset KEYSTORE_B64
          gradle -p android :app:assembleRelease :app:lintRelease -PproductionAds=true --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='ru.moorkis.shodi'"
          mkdir -p android-release-output
          cp "$apk" android-release-output/shodi-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shodi-rustore-apk
          path: android-release-output/shodi-2.0.0.apk
          if-no-files-found: error
          retention-days: 3
